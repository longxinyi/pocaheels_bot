<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Poca Heels</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#fff;--sec:#efeff3;--text:#111;--hint:#5f6368;--btn:#1f6fb2;--btn-text:#fff;--link:#1f6fb2;--line:rgba(127,127,127,.25);--danger:#c62828;--ok:#1e6b2b;--info-bg:rgba(31,111,178,.12);--kind-p:#5a2fa5;--kind-h:#a81450}
*{box-sizing:border-box}
html,body{margin:0;background:var(--sec);color:var(--text);font:16px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
#app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
main{flex:1;padding:12px;display:flex;flex-direction:column;gap:12px;padding-bottom:24px}
h1{margin:4px 4px 0;font-size:22px}
h2{margin:0;font-size:16px}
.card{background:var(--bg);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.hint{font-size:14px;color:var(--hint)}
.pad{padding:0 4px}
.primary,.outline,.danger,.plain{min-height:48px;border-radius:10px;font-weight:600;width:100%}
.primary{border:0;background:var(--btn);color:var(--btn-text)}
.outline{border:1px solid var(--link);background:transparent;color:var(--link)}
.danger{border:1px solid var(--danger);background:transparent;color:var(--danger)}
.plain{border:1px solid var(--line);background:var(--bg)}
.alert{width:100%;text-align:left;min-height:56px;padding:10px 12px;border:1px solid #f0c48a;border-radius:12px;background:#fff4e5;color:#7a3e00}
.calhead{display:flex;align-items:center;justify-content:space-between}
.calhead strong{font-size:17px}
.icon{width:44px;height:44px;border:0;background:transparent;color:var(--link);font-size:24px;line-height:1}
.week,.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.week{font-size:12px;font-weight:600;color:var(--hint)}
.day{height:44px;padding:0;border:2px solid transparent;border-radius:10px;background:transparent;font-size:15px;font-weight:600}
.day:disabled{visibility:hidden}
.day.class{background:var(--btn);color:var(--btn-text)}
.day.free{background:#6a3fb5;color:#fff}
.day.performance{background:#c2185b;color:#fff}
.day.hangout{background:#2e7d32;color:#fff}
.day.cancelled{background:#d8dadf;color:#3c4043;text-decoration:line-through}
.day.today{border-color:#9aa0a6}
.day.sel{border-color:var(--text)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;color:var(--hint)}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;margin-right:6px;vertical-align:-2px}
.titlerow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.titlerow h2{font-size:18px}
.tag{font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px}
.tag.free{background:rgba(106,63,181,.18);color:var(--kind-p)}
.tag.performance{background:rgba(194,24,91,.16);color:var(--kind-h)}
.tag.hangout{background:rgba(46,125,50,.16);color:var(--ok)}
.day{position:relative}
.day .dot{position:absolute;bottom:4px;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:#2e7d32;box-shadow:0 0 0 1px #fff}
.spin{display:inline-block;width:16px;height:16px;margin-right:8px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;vertical-align:-3px;animation:spin .7s linear infinite}
.seg .spin{margin-right:0}
.busy{cursor:default}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2s}}
.hg{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
.hg:first-of-type{border-top:0;padding-top:0}
.hgtop{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tag.cancelled{background:var(--sec);color:var(--hint)}
.big{font-size:28px;font-weight:700;line-height:1}
.big span{font-size:16px;font-weight:500;color:var(--hint)}
.check{display:flex;align-items:center;gap:10px;min-height:44px}
input[type=checkbox]{width:22px;height:22px;flex-shrink:0;accent-color:var(--btn)}
.progress{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.progress div{height:8px;background:var(--btn)}
.sum{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sum b{font-size:26px}
.sum b span{font-size:15px;font-weight:500;color:var(--hint)}
.row{display:flex;align-items:center;gap:10px;min-height:52px;border-top:1px solid var(--line)}
.rowbtn{flex:1;min-height:44px;display:flex;justify-content:space-between;align-items:center;gap:8px;border:0;background:transparent;padding:0;text-align:left}
.small{min-height:40px;padding:0 14px;border:0;border-radius:8px;background:var(--btn);color:var(--btn-text);font-weight:600}
.text-danger{min-height:40px;padding:0 12px;border:0;background:transparent;color:var(--danger);font-weight:600}
.okline{font-size:14px;text-align:right;color:var(--ok);font-weight:600}
input[type=text],input[type=number],select{font-weight:400;width:100%;min-height:48px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text)}
.row select{width:auto;min-height:40px;margin-left:auto}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding:3px;border-radius:10px;background:var(--sec)}
.seg button{min-height:44px;border:0;border-radius:8px;background:transparent;font-size:15px;font-weight:600}
.seg .coming.on{background:var(--bg);color:var(--link);box-shadow:inset 0 0 0 1px var(--link)}
.seg .late.on{background:#8a4500;color:#fff}
.seg .absent.on{background:var(--danger);color:#fff}
.month{display:flex;align-items:center;gap:8px;width:100%;min-height:52px;margin:6px 0 0;padding:0 4px 6px;border:0;border-bottom:2px solid var(--text);background:transparent;font-size:22px;font-weight:700;color:var(--text);text-align:left}
.month .count{margin-left:auto;font-size:14px;font-weight:500;color:var(--hint)}
.month svg{flex-shrink:0;transition:transform .15s}
.month[aria-expanded=true] svg{transform:rotate(180deg)}
.primary:disabled{opacity:.4;cursor:default}
.infoline{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pencil{width:44px;height:44px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--link)}
.cl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.cl:first-child{border-top:0;padding-top:0}
.cl:last-child{padding-bottom:0}
.cl .wide{grid-column:1/-1}
.cl .day-name{font-weight:600;display:block}
.cl .tag{display:inline-block;margin-top:3px}
.cl .seg{grid-template-columns:repeat(3,66px);gap:2px;padding:2px}
.cl .seg button{min-height:44px;font-size:14px;padding:0}
.cl input[type=text]{min-height:44px}
.card.list{gap:0;padding:12px 14px}
.usual{display:flex;gap:6px;font-size:14px;color:var(--hint);padding:0 4px}
.month small{font-size:14px;font-weight:600;color:var(--ok)}
.when{font-size:14px;color:var(--hint)}
.field{display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:600;min-width:0}
.times{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
input[type=time]{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;text-align:left;width:100%;min-height:48px;padding:0 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font-weight:400}
.amount{font-size:38px;font-weight:700;line-height:1}
.line{display:flex;justify-content:space-between;gap:12px;padding-top:8px;border-top:1px solid var(--line);font-size:15px}
.line b{white-space:nowrap}
.note{padding:10px 12px;border-radius:10px;background:var(--info-bg);font-size:15px}
nav{position:sticky;bottom:0;display:flex;background:var(--bg);border-top:1px solid var(--line)}
nav button{flex:1;min-height:56px;border:0;border-top:3px solid transparent;background:transparent;font-size:14px;font-weight:600;color:var(--hint);padding:0 4px}
nav button.on{color:var(--link);border-top-color:var(--link)}
.toast{position:fixed;left:50%;bottom:72px;transform:translateX(-50%);width:calc(100% - 24px);max-width:456px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;border-radius:12px;background:#212121;color:#fff;z-index:20}
.toast button{min-height:40px;padding:0 8px;border:0;background:transparent;color:#8cc8ff;font-weight:700}
.saving{position:fixed;top:8px;left:50%;transform:translateX(-50%);padding:6px 14px;border-radius:999px;background:#212121;color:#fff;font-size:14px;z-index:30}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:32px;text-align:center}
.overlay{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;background:rgba(0,0,0,.45);z-index:10}
.sheet{width:100%;max-width:480px;max-height:88vh;overflow-y:auto;background:var(--bg);border-radius:16px 16px 0 0;padding:16px;display:flex;flex-direction:column;gap:10px}
.sheethead{display:flex;align-items:center;justify-content:space-between}
.total{display:flex;justify-content:space-between;padding:8px 0;border-top:2px solid var(--text);font-size:17px;font-weight:700}
.inline{display:flex;gap:8px}
.inline input{flex:1;min-width:0}
.inline button{width:auto;padding:0 18px}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function () {
  'use strict';
  var API_URL = window.POCA_API_URL || 'https://script.google.com/macros/s/AKfycbwWN2WAhjDsjX623W94bFiee1u9BDBgoP0chcRT6gJ3UFPtrlvdeLEZOBnvDfMXGimBIw/exec';
  var tg = window.Telegram && window.Telegram.WebApp;
  if (tg) {
    tg.ready();
    tg.expand();
    var t = tg.themeParams || {};
    var map = { '--bg': t.bg_color, '--sec': t.secondary_bg_color, '--text': t.text_color, '--hint': t.hint_color, '--btn': t.button_color, '--btn-text': t.button_text_color, '--link': t.link_color };
    Object.keys(map).forEach(function (k) { if (map[k]) document.documentElement.style.setProperty(k, map[k]); });
    if (tg.colorScheme === 'dark') {
      document.documentElement.style.setProperty('--ok', '#5fd38a');
      document.documentElement.style.setProperty('--danger', '#ff6b6b');
      document.documentElement.style.setProperty('--kind-p', '#c4a7ff');
      document.documentElement.style.setProperty('--kind-h', '#ff8ab5');
    }
  }

  var DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  var MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  var MONTH = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  var S = null;
  var ui = { tab: null, sel: null, y: null, m: null, sheet: null, diff: '', unsel: {}, toast: null, undo: null, saving: false, loadError: null, edit: false, editing: false, adding: false, hg: null, confirmDel: null, openMonths: {}, draft: null, groups: null, approve: {}, paynow: null };
  var toastTimer = null;

  function pad(n) { return String(n).padStart(2, '0'); }
  function iso(y, m, d) { return y + '-' + pad(m + 1) + '-' + pad(d); }
  function dt(s) { var p = s.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2] || 1); }
  function lab(s) { var d = dt(s); return DAYS[d.getDay()] + ' ' + d.getDate() + ' ' + MON[d.getMonth()]; }
  function monthOf(m) { return MONTH[Number(m.slice(5)) - 1]; }
  function esc(v) { return String(v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function addMonth(m, n) { var d = dt(m + '-01'); d.setMonth(d.getMonth() + n); return d.getFullYear() + '-' + pad(d.getMonth() + 1); }
  function nextMonthName(m) { return monthOf(addMonth(m, 1)); }
  function niceTime(v) {
    var p = String(v || '').split(':').map(Number);
    if (p.length < 2 || isNaN(p[0])) return '';
    var h = p[0] % 12 || 12;
    return h + (p[1] ? '.' + pad(p[1]) : '') + (p[0] < 12 ? 'am' : 'pm');
  }
  function whenWhere(c) {
    var time = c.start ? niceTime(c.start) + (c.end ? ' to ' + niceTime(c.end) : '') : '';
    return [time, c.location].filter(Boolean).join(', ');
  }
  var KIND = { paid: 'Training', free: 'Extra', performance: 'Performance', hangout: 'Hangout' };
  function itemTag(c) {
    if (c.cancelled) return '<span class="tag cancelled">Cancelled</span>';
    if (c.kind && c.kind !== 'paid') return '<span class="tag ' + esc(c.kind) + '">' + esc(KIND[c.kind] || '') + '</span>';
    return '';
  }
  function carryText(c, m) { return c > 0 ? '$' + c + ' comes off ' + nextMonthName(m) + '.' : c < 0 ? '$' + (-c) + ' gets added to ' + nextMonthName(m) + '.' : ''; }

  function toast(text, undo) {
    ui.toast = text; ui.undo = undo || null;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { ui.toast = null; ui.undo = null; render(); }, 6000);
  }
  // Saves run one after another so they can't overwrite each other.
  var chain = Promise.resolve(), inflight = 0, writes = 0, tapped = null, busy = [];
  function markBusy() {
    var k = tapped;
    tapped = null;
    if (k) busy.push(k);
    return k;
  }
  function clearBusy(k) {
    var i = busy.indexOf(k);
    if (i >= 0) busy.splice(i, 1);
  }
  function showBusy() {
    busy.forEach(function (k) {
      [].forEach.call(document.querySelectorAll('[data-act]'), function (el) {
        if (el.getAttribute('data-act') !== k.act || el.getAttribute('data-arg') !== k.arg) return;
        var inSeg = !!el.closest('.seg');
        el.classList.add('busy');
        el.disabled = true;
        el.innerHTML = '<span class="spin" aria-hidden="true"></span>' + (inSeg ? '' : 'Saving...');
      });
    });
  }
  var CACHE_KEY = 'poca:' + (tg && tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user.id : 'anon');
  function adopt(res) {
    S = res; ui.month = res.month; init();
    try {
      if (res.pending || res.removed) localStorage.removeItem(CACHE_KEY);
      else localStorage.setItem(CACHE_KEY, JSON.stringify(res));
    } catch (e) { /* the app still works without the saved copy */ }
  }
  // Shows the last saved copy straight away, then quietly swaps in the latest data.
  function start() {
    var saved = null;
    try { saved = JSON.parse(localStorage.getItem(CACHE_KEY)); } catch (e) { saved = null; }
    if (!saved || !tg || !tg.initData) { render(); call('state'); return; }
    S = saved; ui.month = saved.paymentMonth; init(); render();
    post('state').then(function (res) {
      inflight--;
      if (res.error) { toast(res.error); render(); return; }
      if (inflight === 0) adopt(res);
      softRender();
    }).catch(function () { inflight--; toast('Could not refresh. Showing your last saved data.'); render(); });
  }
  function post(action, payload) {
    inflight++;
    var body = JSON.stringify({ initData: tg.initData, action: action, payload: Object.assign({ month: ui.month }, payload || {}) });
    var p = chain.then(function () {
      return fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: body }).then(function (r) { return r.json(); });
    });
    chain = p.catch(function () {});
    return p;
  }
  function softRender() {
    var f = document.activeElement;
    if (f && (f.tagName === 'INPUT' || f.tagName === 'SELECT')) return;
    render();
  }
  function call(action, payload, done) {
    if (!tg || !tg.initData) { ui.loadError = 'Please open this from the Telegram bot.'; render(); return; }
    var key = markBusy();
    ui.saving = true; render();
    post(action, payload)
      .then(function (res) {
        inflight--;
        clearBusy(key);
        ui.saving = false; ui.loadError = null;
        if (res.error) {
          if (!S) ui.loadError = res.error; else toast(res.error);
          render();
          return;
        }
        if (inflight === 0) adopt(res);
        if (res.groups) ui.groups = res.groups;
        if (done) done(res);
        render();
      })
      .catch(function () {
        inflight--;
        clearBusy(key);
        ui.saving = false;
        if (!S) ui.loadError = 'Could not connect. Please check your internet and try again.';
        else toast('That did not save. Please try again.');
        render();
      });
  }
  // Shows the change straight away and saves in the background. A failed save reloads the real data.
  function quick(action, payload, apply) {
    if (!tg || !tg.initData) return;
    var key = markBusy();
    if (apply) apply();
    writes++;
    render();
    post(action, payload)
      .then(function (res) {
        inflight--; writes--;
        clearBusy(key);
        if (res.error) { toast(res.error); call('state'); return; }
        if (inflight === 0) adopt(res);
        softRender();
      })
      .catch(function () {
        inflight--; writes--;
        clearBusy(key);
        toast('That did not save. Please try again.');
        call('state');
      });
  }
  function init() {
    if (S.pending || S.removed) return;
    if (!ui.tab) ui.tab = S.admin ? 'classes' : 'myclasses';
    if (ui.y === null) {
      var d = dt(S.today); ui.y = d.getFullYear(); ui.m = d.getMonth();
    }
    if (ui.tab === 'mypay' && !S.myPayment) ui.tab = 'myclasses';
    if (ui.tab === 'me' && !(S.admin && S.me.pays)) ui.tab = S.admin ? 'classes' : 'myclasses';
  }

  // ---------- admin: classes ----------
  function classesView() {
    var byDate = {};
    (S.admin ? S.admin.classes : S.calendar).forEach(function (c) { byDate[c.date] = c; });
    var hgDates = {};
    S.hangouts.forEach(function (h) { hgDates[h.date] = true; });
    var first = new Date(ui.y, ui.m, 1), blanks = (first.getDay() + 6) % 7, count = new Date(ui.y, ui.m + 1, 0).getDate(), cells = '';
    for (var i = 0; i < blanks; i++) cells += '<button class="day" disabled aria-hidden="true"></button>';
    for (var day = 1; day <= count; day++) {
      var s = iso(ui.y, ui.m, day), c = byDate[s];
      var cls = c ? (c.cancelled ? 'cancelled' : c.kind === 'free' ? 'free' : c.kind === 'performance' ? 'performance' : c.kind === 'hangout' ? 'hangout' : 'class') : '';
      var kind = c ? (c.cancelled ? 'cancelled' : (KIND[c.kind] || 'class')) : (hgDates[s] ? 'hangout' : 'nothing on');
      if (!cls && hgDates[s]) cls = 'hangout';
      var dot = c && hgDates[s] ? '<span class="dot"></span>' : '';
      if (c && hgDates[s]) kind += ', hangout';
      cells += '<button class="day ' + cls + (s === S.today ? ' today' : '') + (s === ui.sel ? ' sel' : '') + '" aria-label="' + lab(s) + ', ' + kind + '" data-act="pick" data-arg="' + s + '">' + day + dot + '</button>';
    }
    return '<h1>Calendar</h1>' +
      '<section class="card"><div class="calhead"><button class="icon" aria-label="Previous month" data-act="calMonth" data-arg="-1">&#8249;</button><strong>' + MONTH[ui.m] + ' ' + ui.y + '</strong><button class="icon" aria-label="Next month" data-act="calMonth" data-arg="1">&#8250;</button></div>' +
      '<div class="week"><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div><div>Sun</div></div><div class="cal">' + cells + '</div>' +
      '<div class="legend"><span><i style="background:var(--btn)"></i>Training</span><span><i style="background:#6a3fb5"></i>Extra</span><span><i style="background:#c2185b"></i>Performance</span><span><i style="background:#2e7d32"></i>Hangout</span><span><i style="background:#d8dadf"></i>Cancelled</span></div>' +
      (S.admin ? '<div class="hint">Mondays are added for you. Tap any date to change it or add something.</div>' : '<div class="hint">Tap a date to see the details or add a hangout.</div>') + '</section>' + (S.admin ? selectedView(byDate) : memberSelected(byDate)) + hangoutSection();
  }
  var PENCIL = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"></path></svg>';
  function draftFor(s, c) {
    if (ui.draft && ui.draft.date === s) return ui.draft;
    var base = c || S.admin.defaults;
    ui.draft = { date: s, start: base.start, end: base.end, location: base.location, kind: c ? (c.kind || 'paid') : 'free', title: c ? (c.title || '') : '', statuses: {}, notify: true };
    return ui.draft;
  }
  function currentClass() {
    return S.admin.classes.filter(function (c) { return c.date === ui.sel; })[0] || null;
  }
  function canSave() {
    var f = ui.draft, c = currentClass();
    if (!f || !f.start || !f.end || !String(f.location || '').trim()) return false;
    if (!c) return true;
    if (f.start !== c.start || f.end !== c.end || String(f.location).trim() !== c.location) return true;
    if (f.kind !== (c.kind || 'paid') || String(f.title).trim() !== (c.title || '')) return true;
    return c.everyone.some(function (p) { return f.statuses[p.id] && f.statuses[p.id] !== p.status; });
  }
  function refreshSave() {

  // ---------- admin: payments ----------

      return '<div class="row"><input type="checkbox" aria-label="Include ' + esc(r.name) + ' in the reminder" data-change="unsel" data-arg="' + esc(r.id) + '"' + (ui.unsel[r.id] ? '' : ' checked') + '><button class="rowbtn" data-act="open" data-arg="' + esc(r.id) + '"><span>' + esc(r.name) + '</span><strong>$' + r.toPay + '</strong></button></div>';
    }).join('') + '<button class="primary" data-act="remind">Remind selected in group (' + selected + ')</button><button class="outline" data-act="markAll">Mark everyone as paid</button></section>';

  function sheetView() {

  // ---------- member ----------
  function usualClass() {
    var counts = {}, best = '';
    S.myClasses.forEach(function (c) {
      var w = whenWhere(c);
      counts[w] = (counts[w] || 0) + 1;
      if (!best || counts[w] > counts[best]) best = w;
    });
    return best;
  }
  function myClassesCards() {
    var groups = {}, order = [], usual = usualClass();

    if (!order.length) return '<section class="card"><div class="hint">No upcoming classes yet.</div></section>';
    var CHEVRON = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>';
    return (usual ? '<div class="usual">Usually ' + esc(usual) + '</div>' : '') + order.map(function (m, i) {
      var open = ui.openMonths[m] === undefined ? i === 0 : ui.openMonths[m];
      var n = groups[m].length;
      var head = '<button class="month" aria-expanded="' + open + '" data-act="toggleMonth" data-arg="' + m + '|' + open + '">' + monthOf(m) + (m < S.startMonth ? ' <small>already paid</small>' : '') + '<span class="count">' + n + (n === 1 ? ' item' : ' items') + '</span>' + CHEVRON + '</button>';
      if (!open) return head;
      return head + '<section class="card list">' + groups[m].map(function (c) {

        return '<div class="cl"><div><span class="day-name">' + lab(c.date) + '</span>' + (c.title ? '<span class="when" style="display:block;font-weight:600">' + esc(c.title) + '</span>' : '') + (w !== usual ? '<span class="when">' + esc(w) + '</span>' : '') + (itemTag(c) ? '<br>' + itemTag(c) : '') + '</div><div class="seg">' +
          [['coming', 'Coming'], ['late', 'Late'], ['absent', 'Absent']].map(function (o) { return '<button class="' + o[0] + (c.status === o[0] ? ' on' : '') + '" aria-label="' + lab(c.date) + ': ' + o[1] + '" aria-pressed="' + (c.status === o[0]) + '" data-act="status" data-arg="' + c.date + '|' + o[0] + '">' + o[1] + '</button>'; }).join('') + '</div>' +

  }
  function myPaymentView() {

  // ---------- page ----------
  function center(title, text, retry) {
    return '<div class="center"><h1>' + esc(title) + '</h1><div class="hint">' + esc(text) + '</div>' + (retry ? '<button class="primary" style="max-width:240px" data-act="reload">Try again</button>' : '') + '</div>';
  }
  function render() {
    var y = window.scrollY, html;
    if (ui.loadError) html = center('Something went wrong', ui.loadError, true);
    else if (!S) html = center('Loading', 'One moment...');
    else if (S.pending) html = center('Almost there', 'Hi ' + S.name + '. Your teacher needs to approve you before you can use the app. Check back soon.', true);
    else if (S.removed) html = center('No access', 'You\'re no longer on this team. Ask your teacher if this is a mistake.');
    else {
      var tabs = [];
      if (S.admin) tabs = [['classes', 'Calendar'], ['payments', 'Payments'], ['people', 'People']];
      if (S.admin) { if (S.me.pays) tabs.push(['me', 'Me']); }
      else { tabs.push(['classes', 'Calendar']); tabs.push(['myclasses', 'My classes']); if (S.myPayment) tabs.push(['mypay', 'My payment']); }
      var view = ui.tab === 'classes' ? classesView() : ui.tab === 'payments' ? paymentsView() : ui.tab === 'people' ? peopleView() : ui.tab === 'me' ? meView() : ui.tab === 'mypay' ? myPaymentView() : myClassesView();
      html = '<main>' + view + '</main><nav>' + tabs.map(function (n) { return '<button class="' + (ui.tab === n[0] ? 'on' : '') + '" data-act="tab" data-arg="' + n[0] + '">' + n[1] + '</button>'; }).join('') + '</nav>' + sheetView();
    }
    if (ui.toast) html += '<div class="toast" role="status"><span>' + esc(ui.toast) + '</span>' + (ui.undo ? '<button data-act="undo">Undo</button>' : '') + '</div>';
    if ((ui.saving || writes > 0) && S && !busy.length) html += '<div class="saving" role="status">Saving...</div>';
    document.getElementById('app').innerHTML = html;
    showBusy();
    window.scrollTo(0, y);
  }

  var actions = {
    reload: function () { ui.loadError = null; call('state'); },
    tab: function (a) { ui.tab = a; window.scrollTo(0, 0); render(); },
    meView: function (a) { ui.meView = a; window.scrollTo(0, 0); render(); },
    pick: function (a) { ui.sel = a; ui.edit = false; ui.editing = false; ui.adding = false; ui.hg = null; ui.confirmDel = null; ui.draft = null; render(); },
    startAdding: function () { ui.adding = true; ui.draft = null; render(); },
    stopAdding: function () { ui.adding = false; ui.draft = null; render(); },
    addHangout: function () { ui.hg = { id: null, date: ui.sel, title: '', start: '', end: '', location: '', notify: true }; render(); },

      var h = S.hangouts.filter(function (x) { return x.id === a; })[0];
      ui.hg = { id: h.id, date: h.date, title: h.title, start: h.start, end: h.end, location: h.location, notify: true };
      render();
    },
    closeHangout: function () { ui.hg = null; render(); },
    saveHangout: function () {
      var f = ui.hg;
      if (!canSaveHangout()) return;
      call('saveHangout', { id: f.id, date: f.date, title: f.title, start: f.start, end: f.end, location: f.location, notify: f.notify }, function () {
        ui.hg = null;
        toast('Hangout saved.');
      });
    },
    deleteHangout: function (a) {
      if (ui.confirmDel !== a) { ui.confirmDel = a; render(); return; }
      ui.confirmDel = null;
      call('deleteHangout', { id: a }, function () { toast('Hangout deleted.'); });
    },
    goHangout: function (a) {
      quick('toggleGoing', { id: a }, function () {
        S.hangouts.forEach(function (h) {
          if (h.id !== a) return;
          h.imGoing = !h.imGoing;
          h.going = h.imGoing ? h.going.concat(S.me.name) : h.going.filter(function (n) { return n !== S.me.name; });
        });
      });
    },
    toggleMonth: function (a) { var p = a.split('|'); ui.openMonths[p[0]] = p[1] !== 'true'; render(); },
    editClass: function () { ui.editing = true; ui.draft = null; render(); },
    stopEditing: function () { ui.editing = false; ui.edit = false; ui.draft = null; render(); },
    calMonth: function (a) { var d = new Date(ui.y, ui.m + Number(a), 1); ui.y = d.getFullYear(); ui.m = d.getMonth(); ui.sel = null; ui.edit = false; ui.editing = false; ui.adding = false; ui.hg = null; ui.draft = null; render(); },
    payMonth: function (a) { var m = addMonth(S.month, Number(a)); if (m < S.startMonth) return; ui.month = m; call('state'); },
    addClass: function () {
      var f = ui.draft;
      if (f.kind === 'hangout') {
        if (!String(f.title).trim()) { toast('Please enter a name.'); render(); return; }
        call('saveHangout', { date: f.date, title: f.title, start: f.start, end: f.end, location: f.location, notify: f.notify }, function () {
          ui.draft = null; ui.adding = false;
          toast('Added.');
        });
        return;
      }
      if (!f.start || !f.end || !String(f.location).trim()) { toast('Please enter a time and location.'); render(); return; }
      call('saveClass', { date: f.date, start: f.start, end: f.end, location: f.location, kind: f.kind, title: f.title, cancelled: false, notify: f.notify }, function () {
        ui.draft = null; ui.adding = false;
        toast('Added.');
      });
    },
    saveClass: function () {
      var f = ui.draft;
      if (!canSave()) return;
      var notify = !!ui.editing && f.notify;
      var statuses = Object.keys(f.statuses).map(function (id) { return { id: id, status: f.statuses[id] }; });
      call('saveClass', { date: f.date, start: f.start, end: f.end, location: f.location, kind: f.kind, title: f.title, statuses: statuses, notify: notify }, function () {
        ui.draft = null; ui.editing = false; ui.edit = false;
        toast('Saved.');
      });
    },
    restoreClass: function () { ui.draft = null; call('saveClass', { date: ui.sel, cancelled: false }); },
    cancelClass: function () {
      var day = ui.sel;
      ui.draft = null;
      call('saveClass', { date: day, cancelled: true, notify: true }, function () { toast('Class cancelled.', { action: 'saveClass', payload: { date: day, cancelled: false } }); });
    },
    toggleEdit: function () { ui.edit = true; ui.draft = null; render(); },
    open: function (a) { ui.sheet = a; ui.diff = ''; ui.toast = null; render(); },
    closeSheet: function () { ui.sheet = null; render(); },
    confirm: function (a) {
      call('confirm', { id: a }, function () { toast('Confirmed.'); });
    },
    remind: function () {
      var ids = S.admin.payments.filter(function (r) { return r.state === 'none' && !ui.unsel[r.id]; }).map(function (r) { return r.id; });
      if (!ids.length) { toast('Tick at least one person first.'); render(); return; }
      call('remind', { ids: ids }, function () { toast('Reminder posted to the group.'); });
    },
    markAll: function () {
      var ids = S.admin.payments.filter(function (r) { return r.state === 'none' || r.state === 'claimed'; }).map(function (r) { return r.id; });
      var month = S.month;
      call('markAll', {}, function () { toast('Everyone marked as paid.', { action: 'resetPay', payload: { ids: ids, month: month } }); });
    },
    markExact: function () { var id = ui.sheet; call('markPaid', { id: id }, function () { ui.sheet = null; toast('Marked as paid.'); }); },
    saveDiff: function () {
      var n = Number(ui.diff), id = ui.sheet;
      if (ui.diff === '' || isNaN(n) || n < 0) return;
      call('markPaid', { id: id, amount: n }, function () { ui.sheet = null; toast('$' + n + ' saved.'); });
    },
    resetPay: function () { var id = ui.sheet; call('resetPay', { id: id }, function () { ui.sheet = null; }); },
    download: function () { var u = S.admin.sheetUrl; if (tg && tg.openLink) tg.openLink(u); else window.open(u); },
    approve: function (a) {
      var f = ui.approve[a];
      call('approve', { id: a, name: f.name, role: f.kind === 'member' ? 'member' : 'admin', pays: f.kind !== 'admin' }, function () { delete ui.approve[a]; toast(f.name + ' approved.'); });
    },
    decline: function (a) { call('decline', { id: a }); },
    removePerson: function (a) {
      var p = S.admin.people.filter(function (x) { return x.id === a; })[0];
      call('removePerson', { id: a }, function () { toast(p.name + ' removed.', { action: 'restorePerson', payload: { id: a, role: p.role } }); });
    },
    findGroups: function () { call('findGroups'); },
    setGroup: function (a) {
      var g = ui.groups.filter(function (x) { return x.id === a; })[0];
      call('setGroup', { id: a, title: g.title }, function () { ui.groups = null; toast('Group connected.'); });
    },
    savePaynow: function () { var v = ui.paynow === null ? S.paynow : ui.paynow; call('setPaynow', { value: v }, function () { ui.paynow = null; toast('Saved.'); }); },
    status: function (a) {
      var p = a.split('|');
      var cur = S.myClasses.filter(function (c) { return c.date === p[0]; })[0];
      quick('setStatus', { date: p[0], status: p[1], note: cur ? cur.note : '' }, function () { if (cur) cur.status = p[1]; });
    },
    claim: function () { call('claim', {}, function () { toast('Sent to your teacher to confirm.'); }); },
    unclaim: function () { call('unclaim'); },
    undo: function () { var u = ui.undo; ui.toast = null; ui.undo = null; if (u) call(u.action, u.payload); }
  };

  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]');
    if (!el || ui.saving && el.getAttribute('data-act') !== 'closeSheet' && el.getAttribute('data-act') !== 'tab') return;
    tapped = { act: el.getAttribute('data-act'), arg: el.getAttribute('data-arg') };
    actions[el.getAttribute('data-act')](el.getAttribute('data-arg'));
    tapped = null;
  });
  document.addEventListener('change', function (e) {
    var k = e.target.getAttribute('data-change');
    if (k === 'draftKind' && ui.draft) {
      var f = ui.draft, d = S.admin.defaults, wasHangout = f.kind === 'hangout';
      f.kind = e.target.value;
      if (f.kind === 'hangout' && f.start === d.start && f.end === d.end && f.location === d.location) { f.start = ''; f.end = ''; f.location = ''; }
      if (f.kind !== 'hangout' && wasHangout && !f.start && !f.end && !f.location) { f.start = d.start; f.end = d.end; f.location = d.location; }
      render();
    }
    var hc = e.target.getAttribute('data-hgcheck');
    if (hc && ui.hg) ui.hg[hc] = e.target.checked;
    var dc = e.target.getAttribute('data-draftcheck');
    if (dc && ui.draft) { ui.draft[dc] = e.target.checked; refreshSave(); }
    if (k === 'unsel') { ui.unsel[e.target.getAttribute('data-arg')] = !e.target.checked; render(); }
    if (k === 'statusFor' && ui.draft) { ui.draft.statuses[e.target.getAttribute('data-arg')] = e.target.value; refreshSave(); }
    if (k === 'approveKind') ui.approve[e.target.getAttribute('data-arg')].kind = e.target.value;
    var note = e.target.getAttribute('data-note');
    if (note) quick('setStatus', { date: note, status: 'late', note: e.target.value });
  });
  document.addEventListener('input', function (e) {
    var k = e.target.getAttribute('data-input');
    var hk = e.target.getAttribute('data-hg');
    if (hk && ui.hg) { ui.hg[hk] = e.target.value; var hb = document.getElementById('hgsave'); if (hb) hb.disabled = !canSaveHangout(); }
    var dk = e.target.getAttribute('data-draft');
    if (dk && ui.draft) { ui.draft[dk] = e.target.value; refreshSave(); }
    if (k === 'diff') { ui.diff = e.target.value; document.getElementById('diffnote').textContent = diffNote().replace(/&amp;/g, '&'); }
    if (k === 'paynow') ui.paynow = e.target.value;
    if (k === 'approveName') ui.approve[e.target.getAttribute('data-arg')].name = e.target.value;
  });
  document.addEventListener('visibilitychange', function () { if (!document.hidden && S && !ui.saving && !ui.sheet && !ui.draft && !ui.hg) call('state'); });

  start();
})();
</script>
</body>
</html>
