<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Poca Heels</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#fff;--sec:#efeff3;--text:#111;--hint:#5f6368;--btn:#1f6fb2;--btn-text:#fff;--link:#1f6fb2;--line:rgba(127,127,127,.25);--danger:#c62828;--special:#b35900;--special-bg:rgba(179,89,0,.14);--ok:#1e6b2b;--info-bg:rgba(31,111,178,.12)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--sec);color:var(--text);font:16px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
#app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.bar{background:#212121;color:#fff;padding:8px 12px 10px}
.bar small{display:block;color:#d0d0d0;font-size:12px;margin-bottom:6px}
.seg3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.bar button{min-height:40px;border:0;border-radius:8px;background:#3a3a3a;color:#fff;font-size:14px;font-weight:600}
.bar button.on{background:#fff;color:#111}
main{flex:1;padding:12px;display:flex;flex-direction:column;gap:12px;padding-bottom:24px}
h1{margin:4px 4px 0;font-size:22px}
h2{margin:0;font-size:16px}
.card{background:var(--bg);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.hint{font-size:14px;color:var(--hint)}
.pad{padding:0 4px}
.primary,.outline,.danger,.plain{min-height:48px;border-radius:10px;font-weight:600;width:100%}
.primary{border:0;background:var(--btn);color:var(--btn-text)}
.outline{border:1px solid var(--link);background:transparent;color:var(--link)}
.danger{border:1px solid var(--danger);background:transparent;color:var(--danger)}
.plain{border:1px solid var(--line);background:var(--bg)}
.alert{width:100%;text-align:left;min-height:56px;padding:10px 12px;border:1px solid #f0c48a;border-radius:12px;background:#fff4e5;color:#7a3e00}
.calhead{display:flex;align-items:center;justify-content:space-between}
.calhead strong{font-size:17px}
.icon{width:44px;height:44px;border:0;background:transparent;color:var(--link);font-size:24px;line-height:1}
.week,.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.week{font-size:12px;font-weight:600;color:var(--hint)}
.day{height:44px;padding:0;border:2px solid transparent;border-radius:10px;background:transparent;font-size:15px;font-weight:600}
.day:disabled{visibility:hidden}
.day.class{background:var(--btn);color:var(--btn-text)}
.day.special{background:var(--special);color:#fff}
.day.cancelled{background:#d8dadf;color:#3c4043;text-decoration:line-through}
.day.today{border-color:#9aa0a6}
.day.sel{border-color:var(--text)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;color:var(--hint)}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;margin-right:6px;vertical-align:-2px}
.titlerow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.titlerow h2{font-size:18px}
.tag{font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px}
.tag.special{background:var(--special-bg);color:var(--special)}
.tag.cancelled{background:var(--sec);color:var(--hint)}
.big{font-size:28px;font-weight:700;line-height:1}
.big span{font-size:16px;font-weight:500;color:var(--hint)}
.check{display:flex;align-items:center;gap:10px;min-height:44px}
input[type=checkbox]{width:22px;height:22px;flex-shrink:0;accent-color:var(--btn)}
.progress{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.progress div{height:8px;background:var(--btn)}
.sum{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sum b{font-size:26px}
.sum b span{font-size:15px;font-weight:500;color:var(--hint)}
.row{display:flex;align-items:center;gap:10px;min-height:52px;border-top:1px solid var(--line)}
.rowbtn{flex:1;min-height:44px;display:flex;justify-content:space-between;align-items:center;gap:8px;border:0;background:transparent;padding:0;text-align:left}
.small{min-height:40px;padding:0 14px;border:0;border-radius:8px;background:var(--btn);color:var(--btn-text);font-weight:600}
.text-danger{min-height:40px;padding:0 12px;border:0;background:transparent;color:var(--danger);font-weight:600}
.okline{font-size:14px;text-align:right;color:var(--ok);font-weight:600}
input[type=text],input[type=number]{width:100%;min-height:48px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text)}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding:3px;border-radius:10px;background:var(--sec)}
.seg button{min-height:44px;border:0;border-radius:8px;background:transparent;font-size:15px;font-weight:600}
.seg .coming.on{background:var(--btn);color:var(--btn-text)}
.seg .late.on{background:#8a4500;color:#fff}
.seg .absent.on{background:var(--danger);color:#fff}
.month{margin:6px 4px -4px;font-size:15px;font-weight:700;color:var(--hint)}
.amount{font-size:38px;font-weight:700;line-height:1}
.line{display:flex;justify-content:space-between;gap:12px;padding-top:8px;border-top:1px solid var(--line);font-size:15px}
.line b{white-space:nowrap}
.note{padding:10px 12px;border-radius:10px;background:var(--info-bg);font-size:15px}
.msg{background:var(--bg);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;max-width:92%}
.msg b{font-size:14px;color:var(--link)}
.msg p{margin:0;white-space:pre-line}
.msg small{color:var(--hint)}
.msg button{min-height:44px;border:0;border-radius:8px;background:var(--info-bg);color:var(--link);font-weight:600}
nav{position:sticky;bottom:0;display:flex;background:var(--bg);border-top:1px solid var(--line)}
nav button{flex:1;min-height:56px;border:0;border-top:3px solid transparent;background:transparent;font-size:15px;font-weight:600;color:var(--hint)}
nav button.on{color:var(--link);border-top-color:var(--link)}
.toast{position:fixed;left:50%;bottom:72px;transform:translateX(-50%);width:calc(100% - 24px);max-width:456px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;border-radius:12px;background:#212121;color:#fff;z-index:20}
.toast button{min-height:40px;padding:0 8px;border:0;background:transparent;color:#8cc8ff;font-weight:700}
.overlay{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;background:rgba(0,0,0,.45);z-index:10}
.sheet{width:100%;max-width:480px;max-height:88vh;overflow-y:auto;background:var(--bg);border-radius:16px 16px 0 0;padding:16px;display:flex;flex-direction:column;gap:10px}
.sheethead{display:flex;align-items:center;justify-content:space-between}
.total{display:flex;justify-content:space-between;padding:8px 0;border-top:2px solid var(--text);font-size:17px;font-weight:700}
.inline{display:flex;gap:8px}
.inline input{flex:1;min-width:0}
.inline button{width:auto;padding:0 18px}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function () {
  'use strict';
  var tg = window.Telegram && window.Telegram.WebApp;
  if (tg) {
    tg.ready();
    tg.expand();
    var t = tg.themeParams || {};
    var map = { '--bg': t.bg_color, '--sec': t.secondary_bg_color, '--text': t.text_color, '--hint': t.hint_color, '--btn': t.button_color, '--btn-text': t.button_text_color, '--link': t.link_color };
    Object.keys(map).forEach(function (k) { if (map[k]) document.documentElement.style.setProperty(k, map[k]); });
  }

  var TODAY = '2026-11-02';
  var ME = 'You';
  var DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  var MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  var MONTH = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  var RENT = 5, TRAINING = 25, FULL = RENT + TRAINING;

  function pad(n) { return String(n).padStart(2, '0'); }
  function iso(y, m, d) { return y + '-' + pad(m + 1) + '-' + pad(d); }
  function dt(s) { var p = s.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
  function lab(s) { var d = dt(s); return DAYS[d.getDay()] + ' ' + d.getDate() + ' ' + MON[d.getMonth()]; }
  function esc(v) { return String(v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

  function initData() {
    var people = ['Amy', 'Bella', 'Chloe', 'Dana', 'Emi', 'Fay', 'Gwen', 'Hana', 'Ivy', ME, 'Zoe'];
    var classes = {};
    [[2026, 10], [2026, 11], [2027, 0]].forEach(function (ym) {
      var n = new Date(ym[0], ym[1] + 1, 0).getDate();
      for (var d = 1; d <= n; d++) if (new Date(ym[0], ym[1], d).getDay() === 1) classes[iso(ym[0], ym[1], d)] = { special: false, cancelled: false };
    });
    classes['2026-11-02'].cancelled = true;
    classes['2026-12-14'].cancelled = true;
    classes['2026-12-21'].special = true;
    var status = {};
    people.forEach(function (p) { status[p] = {}; });
    function abs(list, day) { list.forEach(function (p) { status[p][day] = { s: 'absent', note: '' }; }); }
    abs(['Chloe', 'Gwen'], '2026-11-09');
    abs(['Bella', 'Chloe', ME], '2026-11-16');
    abs(['Bella', 'Emi', 'Gwen'], '2026-11-23');
    abs(['Bella'], '2026-11-30');
    abs(['Bella'], '2026-12-07');
    abs(['Bella', 'Fay', 'Gwen', 'Hana'], '2026-12-21');
    abs(['Bella', 'Chloe', 'Emi', 'Fay', 'Gwen', 'Hana', 'Ivy', 'Zoe'], '2026-12-28');
    status.Ivy['2026-12-07'] = { s: 'late', note: 'ETA 8.30pm' };
    var pay = {};
    people.forEach(function (p) { pay[p] = blankPay(); });
    return { people: people, classes: classes, status: status, pay: pay, msgs: [{ text: 'December payment is due on 30 Nov.\nTap below to see your amount.', time: 'Sample message' }] };
  }
  function blankPay() { return { state: 'none', amount: 0, due: 0, specialAbs: [] }; }

  var d = initData();
  var ui = { role: 'teacher', tab: 'classes', myTab: 'classes', y: 2026, m: 11, sel: '2026-12-28', sheet: null, diff: '', newName: '', unsel: {}, toast: null };
  var undoSnap = null, toastTimer = null;

  function st(p, day) { var v = d.status[p] && d.status[p][day]; return v ? v.s : 'coming'; }
  function active(prefix) { return Object.keys(d.classes).filter(function (k) { return k.indexOf(prefix) === 0 && !d.classes[k].cancelled; }).sort(); }
  function fee(p) { return active('2026-12').reduce(function (t, k) { return t + (st(p, k) === 'absent' ? RENT : FULL); }, 0); }
  function novAbs(p) { return active('2026-11').filter(function (k) { return !d.classes[k].special && st(p, k) === 'absent'; }); }
  function offset(p) { return novAbs(p).length * TRAINING; }
  function due(p) { return Math.max(0, fee(p) - offset(p)); }
  function specialAbs(p) { return active('2026-12').filter(function (k) { return d.classes[k].special && st(p, k) === 'absent'; }); }
  function setPay(p, state, amount) { var a = due(p); d.pay[p] = { state: state, due: a, amount: amount === undefined ? a : amount, specialAbs: specialAbs(p) }; }
  function shown(p) { var q = d.pay[p]; return q.state === 'none' ? due(p) : q.due; }
  function carry(p) {
    var q = d.pay[p];
    var penalty = q.state === 'none' ? 0 : specialAbs(p).filter(function (k) { return q.specialAbs.indexOf(k) < 0; }).length * TRAINING;
    return (q.state === 'none' ? 0 : q.amount) + offset(p) - fee(p) - penalty;
  }
  function carryText(c) { return c > 0 ? '$' + c + ' comes off January.' : c < 0 ? '$' + (-c) + ' gets added to January.' : ''; }
  function coming(day) { return d.people.filter(function (p) { return st(p, day) !== 'absent'; }).length; }
  function lateList(day) { return d.people.filter(function (p) { return st(p, day) === 'late'; }).map(function (p) { var n = d.status[p][day].note; return n ? p + ' (' + n + ')' : p; }); }
  function absentList(day) { return d.people.filter(function (p) { return st(p, day) === 'absent'; }); }
  function headcount(day) {
    var late = lateList(day), absent = absentList(day);
    var t = lab(day) + ': ' + coming(day) + ' coming';
    if (late.length) t += '\nLate: ' + late.join(', ');
    return t + '\nAbsent: ' + (absent.length ? absent.join(', ') : 'nobody');
  }
  function linesHtml(p) {
    var act = active('2026-12');
    var away = act.filter(function (k) { return st(p, k) === 'absent'; }).length;
    var here = act.length - away;
    var h = line(here + (here === 1 ? ' class' : ' classes') + ' at $' + FULL, '$' + here * FULL);
    if (away) h += line(away + (away === 1 ? ' absence' : ' absences') + ', rent only at $' + RENT, '$' + away * RENT);
    novAbs(p).forEach(function (k) { h += line('Offset: absent ' + lab(k).slice(4), '-$' + TRAINING); });
    return h;
  }
  function line(l, v) { return '<div class="line"><span>' + esc(l) + '</span><b>' + esc(v) + '</b></div>'; }
  function toast(text, undoable) {
    ui.toast = { text: text, undo: !!undoable };
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { ui.toast = null; undoSnap = null; render(); }, 6000);
  }
  function save() { undoSnap = JSON.stringify(d); }

  function classesView() {
    var alerts = Object.keys(d.classes).sort().filter(function (k) { return k >= TODAY && !d.classes[k].cancelled && coming(k) < 5; }).map(function (k) {
      return '<button class="alert" data-act="jump" data-arg="' + k + '"><strong>' + lab(k) + ': only ' + coming(k) + ' coming.</strong> Tap to view or cancel.</button>';
    }).join('');
    var first = new Date(ui.y, ui.m, 1), blanks = (first.getDay() + 6) % 7, count = new Date(ui.y, ui.m + 1, 0).getDate(), cells = '';
    for (var i = 0; i < blanks; i++) cells += '<button class="day" disabled aria-hidden="true"></button>';
    for (var day = 1; day <= count; day++) {
      var s = iso(ui.y, ui.m, day), c = d.classes[s];
      var cls = c ? (c.cancelled ? 'cancelled' : c.special ? 'special' : 'class') : '';
      var kind = c ? (c.cancelled ? 'cancelled' : c.special ? 'special class' : 'class') : 'no class';
      cells += '<button class="day ' + cls + (s === TODAY ? ' today' : '') + (s === ui.sel ? ' sel' : '') + '" aria-label="' + lab(s) + ', ' + kind + '" data-act="pick" data-arg="' + s + '">' + day + '</button>';
    }
    return '<h1>Classes</h1>' + alerts +
      '<section class="card"><div class="calhead"><button class="icon" aria-label="Previous month" data-act="month" data-arg="-1">&#8249;</button><strong>' + MONTH[ui.m] + ' ' + ui.y + '</strong><button class="icon" aria-label="Next month" data-act="month" data-arg="1">&#8250;</button></div>' +
      '<div class="week"><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div><div>Sun</div></div><div class="cal">' + cells + '</div>' +
      '<div class="legend"><span><i style="background:var(--btn)"></i>Class</span><span><i style="background:var(--special)"></i>Special class</span><span><i style="background:#d8dadf"></i>Cancelled</span></div>' +
      '<div class="hint">Mondays are added for you. Tap any date to change it.</div></section>' + selectedView();
  }
  function selectedView() {
    var s = ui.sel;
    if (!s) return '';
    var c = d.classes[s], tag = '';
    if (c && c.cancelled) tag = '<span class="tag cancelled">Cancelled</span>';
    else if (c && c.special) tag = '<span class="tag special">Special</span>';
    var h = '<section class="card"><div class="titlerow"><h2>' + lab(s) + '</h2>' + tag + '</div>';
    if (!c) h += '<div class="hint">No class on this date.</div><button class="primary" data-act="addClass">Add a class</button>';
    else if (c.cancelled) h += '<div class="hint">Nobody is charged for this class.</div><button class="outline" data-act="restore">Bring this class back</button>';
    else {
      var late = lateList(s), absent = absentList(s);
      h += '<div class="big">' + coming(s) + ' <span>coming</span></div>';
      if (late.length) h += '<div><strong>Late:</strong> ' + esc(late.join(', ')) + '</div>';
      h += '<div><strong>Absent:</strong> ' + esc(absent.length ? absent.join(', ') : 'Nobody') + '</div>' +
        '<label class="check"><input type="checkbox" data-change="special"' + (c.special ? ' checked' : '') + '><span>Special class (external teacher). Cannot be offset once paid.</span></label>' +
        '<button class="primary" data-act="postHeadcount">Post headcount to group</button><button class="danger" data-act="cancelClass">Cancel this class</button>';
    }
    return h + '</section>';
  }
  function paymentsView() {
    var claimed = [], unpaid = [], done = [];
    d.people.forEach(function (p) {
      var q = d.pay[p];
      if (q.state === 'claimed') claimed.push(p);
      else if (q.state === 'none' && due(p) > 0) unpaid.push(p);
      else done.push(p);
    });
    var expected = d.people.reduce(function (t, p) { return t + shown(p); }, 0);
    var received = d.people.reduce(function (t, p) { return t + (d.pay[p].state === 'paid' ? d.pay[p].amount : 0); }, 0);
    var pct = expected ? Math.min(100, Math.round(received / expected * 100)) : 0;
    var selected = unpaid.filter(function (p) { return !ui.unsel[p]; }).length;
    var h = '<h1>December payment</h1><section class="card"><div class="sum"><b>$' + received + ' <span>of $' + expected + '</span></b><span class="hint">Due 30 Nov</span></div><div class="progress"><div style="width:' + pct + '%"></div></div></section>';
    if (claimed.length) h += '<section class="card"><div><h2>Said they\'ve paid</h2><div class="hint">Check these in your bank app, then confirm.</div></div>' + claimed.map(function (p) {
      return '<div class="row"><button class="rowbtn" data-act="open" data-arg="' + esc(p) + '"><span>' + esc(p) + '</span><strong>$' + d.pay[p].due + '</strong></button><button class="small" data-act="confirm" data-arg="' + esc(p) + '">Confirm</button></div>';
    }).join('') + '</section>';
    if (unpaid.length) h += '<section class="card"><div><h2>Not paid yet</h2><div class="hint">Tap a name if they paid a different amount.</div></div>' + unpaid.map(function (p) {
      return '<div class="row"><input type="checkbox" aria-label="Include ' + esc(p) + ' in the reminder" data-change="unsel" data-arg="' + esc(p) + '"' + (ui.unsel[p] ? '' : ' checked') + '><button class="rowbtn" data-act="open" data-arg="' + esc(p) + '"><span>' + esc(p) + '</span><strong>$' + due(p) + '</strong></button></div>';
    }).join('') + '<button class="primary" data-act="remind">Remind selected in group (' + selected + ')</button><button class="outline" data-act="markAll">Mark everyone as paid</button></section>';
    if (done.length) h += '<section class="card"><h2>Done</h2>' + done.map(function (p) {
      var q = d.pay[p], c = carry(p), note = q.state === 'paid' ? 'Paid $' + q.amount : 'Nothing to pay';
      if (c) note += '. ' + carryText(c);
      return '<div class="row"><button class="rowbtn" data-act="open" data-arg="' + esc(p) + '"><span>' + esc(p) + '</span><span class="okline">' + esc(note) + '</span></button></div>';
    }).join('') + '</section>';
    return h + '<button class="plain" data-act="download">Download Excel</button>';
  }
  function peopleView() {
    return '<h1>People</h1><section class="card">' + d.people.map(function (p) {
      return '<div class="row" style="justify-content:space-between"><span>' + esc(p) + '</span>' + (p === ME ? '' : '<button class="text-danger" data-act="removePerson" data-arg="' + esc(p) + '">Remove</button>') + '</div>';
    }).join('') + '</section><section class="card"><label for="newperson"><strong>Add someone</strong></label><input id="newperson" type="text" placeholder="Name" value="' + esc(ui.newName) + '" data-input="newName"><button class="primary" data-act="addPerson">Add</button></section>';
  }
  function myClassesView() {
    var q = d.pay[ME];
    var groups = [['2026-11', 'November (already paid)'], ['2026-12', 'December'], ['2027-01', 'January']];
    return '<h1>My classes</h1><div class="hint pad">You\'re marked as coming unless you change it.</div>' + groups.map(function (g) {
      var items = active(g[0]).filter(function (k) { return k >= TODAY; });
      if (!items.length) return '';
      return '<h2 class="month">' + g[1] + '</h2>' + items.map(function (k) {
        var c = d.classes[k], s = st(ME, k), rec = d.status[ME][k], hint = '';
        var paidFor = g[0] === '2026-11' || (g[0] === '2026-12' && q.state !== 'none');
        if (s === 'absent') hint = paidFor && c.special ? 'Special class: already paid, so this cannot be offset.' : paidFor ? '$' + TRAINING + ' comes off your next payment.' : 'You only pay the $' + RENT + ' rent for this class.';
        else if (c.special) hint = 'External teacher. Cannot be offset once paid.';
        return '<section class="card"><div class="titlerow"><strong>' + lab(k) + '</strong>' + (c.special ? '<span class="tag special">Special</span>' : '') + '</div><div class="seg">' +
          [['coming', 'Coming'], ['late', 'Late'], ['absent', 'Absent']].map(function (o) { return '<button class="' + o[0] + (s === o[0] ? ' on' : '') + '" data-act="status" data-arg="' + k + '|' + o[0] + '">' + o[1] + '</button>'; }).join('') + '</div>' +
          (s === 'late' ? '<input type="text" aria-label="Arrival time or note" placeholder="e.g. ETA 8.30pm" value="' + esc(rec.note) + '" data-input="note" data-arg="' + k + '">' : '') +
          (hint ? '<div class="hint">' + esc(hint) + '</div>' : '') + '</section>';
      }).join('');
    }).join('');
  }
  function myPaymentView() {
    var q = d.pay[ME], amt = shown(ME), c = carry(ME);
    var status = q.state === 'paid' ? 'Paid and confirmed' : q.state === 'claimed' ? 'Waiting for your teacher to confirm' : amt === 0 ? 'Nothing to pay this month' : 'Not paid yet';
    var h = '<h1>My payment</h1><section class="card"><div class="hint">December, due 30 Nov</div><div class="amount">$' + amt + '</div><strong>' + status + '</strong>' + linesHtml(ME);
    if ((q.state !== 'none' || amt === 0) && c) h += '<div class="note">' + carryText(c) + '</div>';
    h += '</section>';
    if (q.state === 'none' && amt > 0) h += '<section class="card"><div>PayNow to [TEACHER\'S PAYNOW NUMBER], with your name in the reference.</div><button class="primary" data-act="claim">I\'ve paid</button></section>';
    if (q.state === 'claimed') h += '<button class="plain" data-act="unclaim">I tapped this by mistake</button>';
    return h;
  }
  function chatView() {
    return '<h1>Group chat</h1><div class="hint pad">A preview of what the bot would post. It doesn\'t post to your real group yet.</div>' + d.msgs.slice().reverse().map(function (m) {
      return '<div class="msg"><b>Poca Heels Bot</b><p>' + esc(m.text) + '</p><small>' + esc(m.time) + '</small><button data-act="openFromChat">Open app</button></div>';
    }).join('');
  }
  function sheetView() {
    var p = ui.sheet;
    if (!p || !d.pay[p]) return '';
    var q = d.pay[p], amt = shown(p), c = carry(p);
    return '<div class="overlay"><div class="sheet" role="dialog" aria-label="' + esc(p) + ' payment"><div class="sheethead"><h2 style="font-size:20px">' + esc(p) + '</h2><button class="icon" aria-label="Close" data-act="closeSheet">&times;</button></div>' + linesHtml(p) +
      '<div class="total"><span>To pay</span><span>$' + amt + '</span></div>' + (q.state === 'paid' && c ? '<div class="note">' + carryText(c) + '</div>' : '') +
      '<button class="primary" data-act="markExact">Paid $' + amt + '</button><label for="diffamt" style="font-weight:700;padding-top:6px">Paid a different amount</label>' +
      '<div class="inline"><input id="diffamt" type="number" inputmode="numeric" placeholder="Amount" value="' + esc(ui.diff) + '" data-input="diff"><button class="outline" data-act="saveDiff">Save</button></div><div class="hint" id="diffnote">' + diffNote() + '</div>' +
      (q.state !== 'none' ? '<button class="plain" style="color:var(--danger);border:0" data-act="resetPay">Change back to not paid</button>' : '') + '</div></div>';
  }
  function diffNote() {
    if (!ui.sheet || ui.diff === '' || isNaN(Number(ui.diff))) return '';
    var gap = Number(ui.diff) - shown(ui.sheet);
    return gap < 0 ? '$' + (-gap) + ' will be added to January.' : gap > 0 ? '$' + gap + ' will come off January.' : '';
  }
  function render() {
    var y = window.scrollY, view;
    if (ui.role === 'chat') view = chatView();
    else if (ui.role === 'teacher') view = ui.tab === 'classes' ? classesView() : ui.tab === 'payments' ? paymentsView() : peopleView();
    else view = ui.myTab === 'classes' ? myClassesView() : myPaymentView();
    var cur = ui.role === 'teacher' ? ui.tab : ui.myTab;
    var tabs = ui.role === 'teacher' ? [['classes', 'Classes'], ['payments', 'Payments'], ['people', 'People']] : ui.role === 'member' ? [['classes', 'My classes'], ['payment', 'My payment']] : [];
    document.getElementById('app').innerHTML =
      '<div class="bar"><small>Sample data, nothing is saved. Try it as:</small><div class="seg3">' + [['teacher', 'Teacher'], ['member', 'Member'], ['chat', 'Group chat']].map(function (r) { return '<button class="' + (ui.role === r[0] ? 'on' : '') + '" data-act="role" data-arg="' + r[0] + '">' + r[1] + '</button>'; }).join('') + '</div></div>' +
      '<main>' + view + '</main>' +
      (tabs.length ? '<nav>' + tabs.map(function (n) { return '<button class="' + (cur === n[0] ? 'on' : '') + '" data-act="tab" data-arg="' + n[0] + '">' + n[1] + '</button>'; }).join('') + '</nav>' : '') +
      (ui.toast ? '<div class="toast" role="status"><span>' + esc(ui.toast.text) + '</span>' + (ui.toast.undo ? '<button data-act="undo">Undo</button>' : '') + '</div>' : '') + sheetView();
    window.scrollTo(0, y);
  }

  var actions = {
    role: function (a) { ui.role = a; ui.sheet = null; window.scrollTo(0, 0); },
    tab: function (a) { if (ui.role === 'teacher') ui.tab = a; else ui.myTab = a; window.scrollTo(0, 0); },
    pick: function (a) { ui.sel = a; },
    jump: function (a) { var t = dt(a); ui.sel = a; ui.y = t.getFullYear(); ui.m = t.getMonth(); },
    month: function (a) {
      var t = new Date(ui.y, ui.m + Number(a), 1);
      if (t >= new Date(2026, 10, 1) && t <= new Date(2027, 0, 1)) { ui.y = t.getFullYear(); ui.m = t.getMonth(); ui.sel = null; }
    },
    addClass: function () { d.classes[ui.sel] = { special: false, cancelled: false }; toast('Class added. Members can see it now.'); },
    restore: function () { d.classes[ui.sel].cancelled = false; },
    postHeadcount: function () { d.msgs.push({ text: headcount(ui.sel), time: 'Just now' }); toast('Added to the Group chat preview.'); },
    cancelClass: function () { save(); d.classes[ui.sel].cancelled = true; d.msgs.push({ text: lab(ui.sel) + ': class is cancelled.', time: 'Just now' }); toast('Class cancelled.', true); },
    open: function (a) { ui.sheet = a; ui.diff = ''; ui.toast = null; },
    closeSheet: function () { ui.sheet = null; },
    confirm: function (a) { d.pay[a].state = 'paid'; toast(a + ' confirmed.'); },
    remind: function () {
      var names = d.people.filter(function (p) { return d.pay[p].state === 'none' && due(p) > 0 && !ui.unsel[p]; });
      if (!names.length) { toast('Tick at least one person first.'); return; }
      d.msgs.push({ text: 'Reminder: December payment is due on 30 Nov.\nStill to pay: ' + names.map(function (n) { return '@' + n; }).join(' ') + '\nTap below to see your amount.', time: 'Just now' });
      toast('Added to the Group chat preview.');
    },
    markAll: function () {
      save();
      d.people.forEach(function (p) { if (d.pay[p].state === 'none' && due(p) > 0) setPay(p, 'paid'); else if (d.pay[p].state === 'claimed') d.pay[p].state = 'paid'; });
      toast('Everyone marked as paid.', true);
    },
    markExact: function () { var p = ui.sheet; setPay(p, 'paid'); ui.sheet = null; toast(p + ' marked as paid.'); },
    saveDiff: function () {
      var n = Number(ui.diff), p = ui.sheet;
      if (ui.diff === '' || isNaN(n) || n < 0) return;
      setPay(p, 'paid', n); ui.sheet = null; toast(p + ': $' + n + ' saved.');
    },
    resetPay: function () { d.pay[ui.sheet] = blankPay(); ui.sheet = null; },
    download: function () { toast('In the real app, this downloads the Excel file.'); },
    removePerson: function (a) { save(); d.people = d.people.filter(function (x) { return x !== a; }); toast(a + ' removed.', true); },
    addPerson: function () {
      var n = ui.newName.trim();
      if (!n || d.people.indexOf(n) >= 0) return;
      d.people.push(n); d.status[n] = {}; d.pay[n] = blankPay(); ui.newName = ''; toast(n + ' added.');
    },
    status: function (a) {
      var p = a.split('|'), me = d.status[ME];
      if (p[1] === 'coming') delete me[p[0]];
      else me[p[0]] = { s: p[1], note: (me[p[0]] && me[p[0]].note) || '' };
    },
    claim: function () { setPay(ME, 'claimed'); toast('Sent to your teacher to confirm.'); },
    unclaim: function () { d.pay[ME] = blankPay(); },
    openFromChat: function () { ui.role = 'member'; ui.myTab = 'payment'; window.scrollTo(0, 0); },
    undo: function () { if (undoSnap) { d = JSON.parse(undoSnap); undoSnap = null; } ui.toast = null; }
  };

  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]');
    if (!el) return;
    actions[el.getAttribute('data-act')](el.getAttribute('data-arg'));
    render();
  });
  document.addEventListener('change', function (e) {
    var k = e.target.getAttribute('data-change');
    if (k === 'special') { d.classes[ui.sel].special = e.target.checked; render(); }
    if (k === 'unsel') { ui.unsel[e.target.getAttribute('data-arg')] = !e.target.checked; render(); }
  });
  document.addEventListener('input', function (e) {
    var k = e.target.getAttribute('data-input');
    if (k === 'newName') ui.newName = e.target.value;
    if (k === 'note') d.status[ME][e.target.getAttribute('data-arg')].note = e.target.value;
    if (k === 'diff') { ui.diff = e.target.value; document.getElementById('diffnote').textContent = diffNote(); }
  });

  ['Amy', 'Dana'].forEach(function (p) { setPay(p, 'paid'); });
  ['Ivy', 'Zoe'].forEach(function (p) { setPay(p, 'claimed'); });
  setPay('Emi', 'paid', 30);
  d.msgs.push({ text: headcount('2026-11-09'), time: 'Sample message' });
  render();
})();
</script>
</body>
</html>
