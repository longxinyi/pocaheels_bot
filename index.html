<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Poca Heels</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#fff;--sec:#efeff3;--text:#111;--hint:#5f6368;--btn:#1f6fb2;--btn-text:#fff;--link:#1f6fb2;--line:rgba(127,127,127,.25);--danger:#c62828;--special:#b35900;--special-bg:rgba(179,89,0,.14);--ok:#1e6b2b;--info-bg:rgba(31,111,178,.12)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--sec);color:var(--text);font:16px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
#app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
main{flex:1;padding:12px;display:flex;flex-direction:column;gap:12px;padding-bottom:24px}
h1{margin:4px 4px 0;font-size:22px}
h2{margin:0;font-size:16px}
.card{background:var(--bg);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.hint{font-size:14px;color:var(--hint)}
.pad{padding:0 4px}
.primary,.outline,.danger,.plain{min-height:48px;border-radius:10px;font-weight:600;width:100%}
.primary{border:0;background:var(--btn);color:var(--btn-text)}
.outline{border:1px solid var(--link);background:transparent;color:var(--link)}
.danger{border:1px solid var(--danger);background:transparent;color:var(--danger)}
.plain{border:1px solid var(--line);background:var(--bg)}
.alert{width:100%;text-align:left;min-height:56px;padding:10px 12px;border:1px solid #f0c48a;border-radius:12px;background:#fff4e5;color:#7a3e00}
.calhead{display:flex;align-items:center;justify-content:space-between}
.calhead strong{font-size:17px}
.icon{width:44px;height:44px;border:0;background:transparent;color:var(--link);font-size:24px;line-height:1}
.week,.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.week{font-size:12px;font-weight:600;color:var(--hint)}
.day{height:44px;padding:0;border:2px solid transparent;border-radius:10px;background:transparent;font-size:15px;font-weight:600}
.day:disabled{visibility:hidden}
.day.class{background:var(--btn);color:var(--btn-text)}
.day.special{background:var(--special);color:#fff}
.day.cancelled{background:#d8dadf;color:#3c4043;text-decoration:line-through}
.day.today{border-color:#9aa0a6}
.day.sel{border-color:var(--text)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;color:var(--hint)}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;margin-right:6px;vertical-align:-2px}
.titlerow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.titlerow h2{font-size:18px}
.tag{font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px}
.tag.special{background:var(--special-bg);color:var(--special)}
.tag.cancelled{background:var(--sec);color:var(--hint)}
.big{font-size:28px;font-weight:700;line-height:1}
.big span{font-size:16px;font-weight:500;color:var(--hint)}
.check{display:flex;align-items:center;gap:10px;min-height:44px}
input[type=checkbox]{width:22px;height:22px;flex-shrink:0;accent-color:var(--btn)}
.progress{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.progress div{height:8px;background:var(--btn)}
.sum{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sum b{font-size:26px}
.sum b span{font-size:15px;font-weight:500;color:var(--hint)}
.row{display:flex;align-items:center;gap:10px;min-height:52px;border-top:1px solid var(--line)}
.rowbtn{flex:1;min-height:44px;display:flex;justify-content:space-between;align-items:center;gap:8px;border:0;background:transparent;padding:0;text-align:left}
.small{min-height:40px;padding:0 14px;border:0;border-radius:8px;background:var(--btn);color:var(--btn-text);font-weight:600}
.text-danger{min-height:40px;padding:0 12px;border:0;background:transparent;color:var(--danger);font-weight:600}
.okline{font-size:14px;text-align:right;color:var(--ok);font-weight:600}
input[type=text],input[type=number],select{font-weight:400;width:100%;min-height:48px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text)}
.row select{width:auto;min-height:40px;margin-left:auto}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding:3px;border-radius:10px;background:var(--sec)}
.seg button{min-height:44px;border:0;border-radius:8px;background:transparent;font-size:15px;font-weight:600}
.seg .coming.on{background:var(--btn);color:var(--btn-text)}
.seg .late.on{background:#8a4500;color:#fff}
.seg .absent.on{background:var(--danger);color:#fff}
.month{margin:18px 4px 0;padding-bottom:6px;font-size:22px;font-weight:700;color:var(--text);border-bottom:2px solid var(--text)}
.month small{font-size:14px;font-weight:500;color:var(--hint)}
.month:first-of-type{margin-top:8px}
.when{font-size:14px;color:var(--hint)}
.field{display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:600}
.times{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
input[type=time]{width:100%;min-height:48px;padding:0 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font-weight:400}
.amount{font-size:38px;font-weight:700;line-height:1}
.line{display:flex;justify-content:space-between;gap:12px;padding-top:8px;border-top:1px solid var(--line);font-size:15px}
.line b{white-space:nowrap}
.note{padding:10px 12px;border-radius:10px;background:var(--info-bg);font-size:15px}
nav{position:sticky;bottom:0;display:flex;background:var(--bg);border-top:1px solid var(--line)}
nav button{flex:1;min-height:56px;border:0;border-top:3px solid transparent;background:transparent;font-size:14px;font-weight:600;color:var(--hint);padding:0 4px}
nav button.on{color:var(--link);border-top-color:var(--link)}
.toast{position:fixed;left:50%;bottom:72px;transform:translateX(-50%);width:calc(100% - 24px);max-width:456px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;border-radius:12px;background:#212121;color:#fff;z-index:20}
.toast button{min-height:40px;padding:0 8px;border:0;background:transparent;color:#8cc8ff;font-weight:700}
.saving{position:fixed;top:8px;left:50%;transform:translateX(-50%);padding:6px 14px;border-radius:999px;background:#212121;color:#fff;font-size:14px;z-index:30}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:32px;text-align:center}
.overlay{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;background:rgba(0,0,0,.45);z-index:10}
.sheet{width:100%;max-width:480px;max-height:88vh;overflow-y:auto;background:var(--bg);border-radius:16px 16px 0 0;padding:16px;display:flex;flex-direction:column;gap:10px}
.sheethead{display:flex;align-items:center;justify-content:space-between}
.total{display:flex;justify-content:space-between;padding:8px 0;border-top:2px solid var(--text);font-size:17px;font-weight:700}
.inline{display:flex;gap:8px}
.inline input{flex:1;min-width:0}
.inline button{width:auto;padding:0 18px}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function () {
  'use strict';
  var API_URL = window.POCA_API_URL || 'PASTE_WEB_APP_URL_HERE';
  var tg = window.Telegram && window.Telegram.WebApp;
  if (tg) {
    tg.ready();
    tg.expand();
    var t = tg.themeParams || {};
    var map = { '--bg': t.bg_color, '--sec': t.secondary_bg_color, '--text': t.text_color, '--hint': t.hint_color, '--btn': t.button_color, '--btn-text': t.button_text_color, '--link': t.link_color };
    Object.keys(map).forEach(function (k) { if (map[k]) document.documentElement.style.setProperty(k, map[k]); });
  }

  var DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  var MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  var MONTH = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  var S = null;
  var ui = { tab: null, sel: null, y: null, m: null, sheet: null, diff: '', unsel: {}, toast: null, undo: null, saving: false, loadError: null, edit: false, draft: null, groups: null, approve: {}, paynow: null };
  var toastTimer = null;

  function pad(n) { return String(n).padStart(2, '0'); }
  function iso(y, m, d) { return y + '-' + pad(m + 1) + '-' + pad(d); }
  function dt(s) { var p = s.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2] || 1); }
  function lab(s) { var d = dt(s); return DAYS[d.getDay()] + ' ' + d.getDate() + ' ' + MON[d.getMonth()]; }
  function monthOf(m) { return MONTH[Number(m.slice(5)) - 1]; }
  function esc(v) { return String(v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function addMonth(m, n) { var d = dt(m + '-01'); d.setMonth(d.getMonth() + n); return d.getFullYear() + '-' + pad(d.getMonth() + 1); }
  function nextMonthName(m) { return monthOf(addMonth(m, 1)); }
  function niceTime(v) {
    var p = String(v || '').split(':').map(Number);
    if (p.length < 2 || isNaN(p[0])) return '';
    var h = p[0] % 12 || 12;
    return h + (p[1] ? '.' + pad(p[1]) : '') + (p[0] < 12 ? 'am' : 'pm');
  }
  function whenWhere(c) {
    var time = c.start ? niceTime(c.start) + (c.end ? ' to ' + niceTime(c.end) : '') : '';
    return [time, c.location].filter(Boolean).join(', ');
  }
  function carryText(c, m) { return c > 0 ? '$' + c + ' comes off ' + nextMonthName(m) + '.' : c < 0 ? '$' + (-c) + ' gets added to ' + nextMonthName(m) + '.' : ''; }

  function toast(text, undo) {
    ui.toast = text; ui.undo = undo || null;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { ui.toast = null; ui.undo = null; render(); }, 6000);
  }
  function call(action, payload, done) {
    if (!tg || !tg.initData) { ui.loadError = 'Please open this from the Telegram bot.'; render(); return; }
    ui.saving = true; render();
    var body = Object.assign({ month: ui.month }, payload || {});
    fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ initData: tg.initData, action: action, payload: body }) })
      .then(function (r) { return r.json(); })
      .then(function (res) {
        ui.saving = false; ui.loadError = null;
        if (res.error) {
          if (!S) ui.loadError = res.error; else toast(res.error);
          render();
          return;
        }
        S = res; ui.month = res.month;
        if (res.groups) ui.groups = res.groups;
        init();
        if (done) done(res);
        render();
      })
      .catch(function () {
        ui.saving = false;
        if (!S) ui.loadError = 'Could not connect. Please check your internet and try again.';
        else toast('That did not save. Please try again.');
        render();
      });
  }
  function init() {
    if (S.pending || S.removed) return;
    if (!ui.tab) ui.tab = S.admin ? 'classes' : 'myclasses';
    if (ui.y === null) {
      var d = dt(S.today); ui.y = d.getFullYear(); ui.m = d.getMonth();
    }
    if (ui.tab === 'mypay' && !S.myPayment) ui.tab = 'myclasses';
  }

  // ---------- admin: classes ----------
  function classesView() {
    var byDate = {};
    S.admin.classes.forEach(function (c) { byDate[c.date] = c; });
    var alerts = S.admin.classes.filter(function (c) { return c.date >= S.today && !c.cancelled && c.coming < S.admin.lowCount && S.admin.people.length; }).slice(0, 3).map(function (c) {
      return '<button class="alert" data-act="jump" data-arg="' + c.date + '"><strong>' + lab(c.date) + ': only ' + c.coming + ' coming.</strong> Tap to view or cancel.</button>';
    }).join('');
    var first = new Date(ui.y, ui.m, 1), blanks = (first.getDay() + 6) % 7, count = new Date(ui.y, ui.m + 1, 0).getDate(), cells = '';
    for (var i = 0; i < blanks; i++) cells += '<button class="day" disabled aria-hidden="true"></button>';
    for (var day = 1; day <= count; day++) {
      var s = iso(ui.y, ui.m, day), c = byDate[s];
      var cls = c ? (c.cancelled ? 'cancelled' : c.special ? 'special' : 'class') : '';
      var kind = c ? (c.cancelled ? 'cancelled' : c.special ? 'special class' : 'class') : 'no class';
      cells += '<button class="day ' + cls + (s === S.today ? ' today' : '') + (s === ui.sel ? ' sel' : '') + '" aria-label="' + lab(s) + ', ' + kind + '" data-act="pick" data-arg="' + s + '">' + day + '</button>';
    }
    return '<h1>Classes</h1>' + alerts +
      '<section class="card"><div class="calhead"><button class="icon" aria-label="Previous month" data-act="calMonth" data-arg="-1">&#8249;</button><strong>' + MONTH[ui.m] + ' ' + ui.y + '</strong><button class="icon" aria-label="Next month" data-act="calMonth" data-arg="1">&#8250;</button></div>' +
      '<div class="week"><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div><div>Sun</div></div><div class="cal">' + cells + '</div>' +
      '<div class="legend"><span><i style="background:var(--btn)"></i>Class</span><span><i style="background:var(--special)"></i>Special class</span><span><i style="background:#d8dadf"></i>Cancelled</span></div>' +
      '<div class="hint">Mondays are added for you. Tap any date to change it.</div></section>' + selectedView(byDate);
  }
  function draftFor(s, c) {
    if (ui.draft && ui.draft.date === s) return ui.draft;
    var base = c || S.admin.defaults;
    ui.draft = { date: s, start: base.start, end: base.end, location: base.location, special: !!(c && c.special), statuses: {}, notify: true };
    return ui.draft;
  }
  function classFields(f) {
    return '<div class="times"><label class="field">Starts<input type="time" value="' + esc(f.start) + '" data-draft="start"></label><label class="field">Ends<input type="time" value="' + esc(f.end) + '" data-draft="end"></label></div>' +
      '<label class="field">Location<input type="text" value="' + esc(f.location) + '" data-draft="location"></label>' +
      '<label class="check"><input type="checkbox" data-draftcheck="special"' + (f.special ? ' checked' : '') + '><span>Special class (external teacher). Cannot be offset once paid.</span></label>' +
      '<label class="check"><input type="checkbox" data-draftcheck="notify"' + (f.notify ? ' checked' : '') + '><span>Tell the group chat if the time or place is new or changed</span></label>';
  }
  function selectedView(byDate) {
    var s = ui.sel;
    if (!s) return '';
    var c = byDate[s], tag = '';
    if (c && c.cancelled) tag = '<span class="tag cancelled">Cancelled</span>';
    else if (c && c.special) tag = '<span class="tag special">Special</span>';
    var h = '<section class="card"><div class="titlerow"><h2>' + lab(s) + '</h2>' + tag + '</div>';
    if (!c) {
      h += '<div class="hint">No class on this date yet. Add one below.</div>' + classFields(draftFor(s, null)) + '<button class="primary" data-act="addClass">Add class</button>';
    } else if (c.cancelled) {
      h += '<div class="hint">Nobody is charged for this class.</div><button class="outline" data-act="restoreClass">Bring this class back</button>';
    } else {
      var f = draftFor(s, c);
      h += '<div class="big">' + c.coming + ' <span>coming</span></div>';
      if (c.late.length) h += '<div><strong>Late:</strong> ' + esc(c.late.join(', ')) + '</div>';
      h += '<div><strong>Absent:</strong> ' + esc(c.absent.length ? c.absent.join(', ') : 'Nobody') + '</div>' +
        '<button class="plain" data-act="postHeadcount">Post headcount to group</button>' + classFields(f) +
        '<button class="plain" data-act="toggleEdit">' + (ui.edit ? 'Hide people' : 'Change someone\'s status') + '</button>';
      if (ui.edit) h += c.everyone.map(function (p) {
        var cur = f.statuses[p.id] || p.status;
        return '<div class="row"><span>' + esc(p.name) + '</span><select aria-label="' + esc(p.name) + ' status" data-change="statusFor" data-arg="' + esc(p.id) + '">' + ['coming', 'late', 'absent'].map(function (o) { return '<option value="' + o + '"' + (cur === o ? ' selected' : '') + '>' + o[0].toUpperCase() + o.slice(1) + '</option>'; }).join('') + '</select></div>';
      }).join('');
      h += '<button class="primary" data-act="saveClass">Save changes</button><button class="danger" data-act="cancelClass">Cancel this class</button>';
    }
    return h + '</section>';
  }

  // ---------- admin: payments ----------
  function paymentsView() {
    var rows = S.admin.payments, claimed = [], unpaid = [], done = [];
    rows.forEach(function (r) {
      if (r.state === 'claimed') claimed.push(r);
      else if (r.state === 'none') unpaid.push(r);
      else done.push(r);
    });
    var expected = rows.reduce(function (a, r) { return a + (r.state === 'paid' || r.state === 'claimed' ? r.paid : r.toPay); }, 0);
    var received = rows.reduce(function (a, r) { return a + (r.state === 'paid' ? r.paid : 0); }, 0);
    var pct = expected ? Math.min(100, Math.round(received / expected * 100)) : 0;
    var selected = unpaid.filter(function (r) { return !ui.unsel[r.id]; }).length;
    var h = '<section class="calhead"><button class="icon" aria-label="Previous month" data-act="payMonth" data-arg="-1">&#8249;</button><h1 style="margin:0">' + monthOf(S.month) + ' payment</h1><button class="icon" aria-label="Next month" data-act="payMonth" data-arg="1">&#8250;</button></section>' +
      '<section class="card"><div class="sum"><b>$' + received + ' <span>of $' + expected + '</span></b><span class="hint">Due ' + lab(S.due).slice(4) + '</span></div><div class="progress"><div style="width:' + pct + '%"></div></div></section>';
    if (!rows.length) h += '<section class="card"><div class="hint">Nobody has joined yet. Approve people on the People tab first.</div></section>';
    if (claimed.length) h += '<section class="card"><div><h2>Said they\'ve paid</h2><div class="hint">Check these in your bank app, then confirm.</div></div>' + claimed.map(function (r) {
      return '<div class="row"><button class="rowbtn" data-act="open" data-arg="' + esc(r.id) + '"><span>' + esc(r.name) + '</span><strong>$' + r.paid + '</strong></button><button class="small" data-act="confirm" data-arg="' + esc(r.id) + '">Confirm</button></div>';
    }).join('') + '</section>';
    if (unpaid.length) h += '<section class="card"><div><h2>Not paid yet</h2><div class="hint">Tap a name if they paid a different amount.</div></div>' + unpaid.map(function (r) {
      return '<div class="row"><input type="checkbox" aria-label="Include ' + esc(r.name) + ' in the reminder" data-change="unsel" data-arg="' + esc(r.id) + '"' + (ui.unsel[r.id] ? '' : ' checked') + '><button class="rowbtn" data-act="open" data-arg="' + esc(r.id) + '"><span>' + esc(r.name) + '</span><strong>$' + r.toPay + '</strong></button></div>';
    }).join('') + '<button class="primary" data-act="remind">Remind selected in group (' + selected + ')</button><button class="outline" data-act="markAll">Mark everyone as paid</button></section>';
    if (done.length) h += '<section class="card"><h2>Done</h2>' + done.map(function (r) {
      var note = r.state === 'paid' ? 'Paid $' + r.paid : 'Nothing to pay';
      if (r.after) note += '. ' + carryText(r.after, S.month);
      return '<div class="row"><button class="rowbtn" data-act="open" data-arg="' + esc(r.id) + '"><span>' + esc(r.name) + '</span><span class="okline">' + esc(note) + '</span></button></div>';
    }).join('') + '</section>';
    return h + '<button class="plain" data-act="download">Download Excel</button>';
  }
  function linesHtml(lines) {
    return lines.map(function (l) { return '<div class="line"><span>' + esc(l.l) + '</span><b>' + esc(l.v) + '</b></div>'; }).join('');
  }
  function sheetView() {
    if (!ui.sheet || !S.admin) return '';
    var r = S.admin.payments.filter(function (x) { return x.id === ui.sheet; })[0];
    if (!r) return '';
    var amt = r.state === 'claimed' ? r.paid : r.toPay;
    return '<div class="overlay"><div class="sheet" role="dialog" aria-label="' + esc(r.name) + ' payment"><div class="sheethead"><h2 style="font-size:20px">' + esc(r.name) + '</h2><button class="icon" aria-label="Close" data-act="closeSheet">&times;</button></div>' + linesHtml(r.lines) +
      '<div class="total"><span>To pay</span><span>$' + amt + '</span></div>' + (r.state === 'paid' && r.after ? '<div class="note">' + esc(carryText(r.after, S.month)) + '</div>' : '') +
      '<button class="primary" data-act="markExact">Paid $' + amt + '</button><label for="diffamt" style="font-weight:700;padding-top:6px">Paid a different amount</label>' +
      '<div class="inline"><input id="diffamt" type="number" inputmode="numeric" placeholder="Amount" value="' + esc(ui.diff) + '" data-input="diff"><button class="outline" data-act="saveDiff">Save</button></div><div class="hint" id="diffnote">' + diffNote() + '</div>' +
      (r.state === 'paid' || r.state === 'claimed' ? '<button class="plain" style="color:var(--danger);border:0" data-act="resetPay">Change back to not paid</button>' : '') + '</div></div>';
  }
  function diffNote() {
    if (!ui.sheet || ui.diff === '' || isNaN(Number(ui.diff))) return '';
    var r = S.admin.payments.filter(function (x) { return x.id === ui.sheet; })[0];
    var gap = Number(ui.diff) - (r.state === 'claimed' ? r.paid : r.toPay);
    return esc(carryText(gap, S.month).replace('comes off', 'will come off').replace('gets added to', 'will be added to'));
  }

  // ---------- admin: people ----------
  function peopleView() {
    var a = S.admin, h = '<h1>People</h1>';
    if (a.pending.length) h += '<section class="card"><h2>Waiting for approval</h2>' + a.pending.map(function (p) {
      var f = ui.approve[p.id] || { name: p.tgName, kind: 'member' };
      ui.approve[p.id] = f;
      return '<div class="card" style="padding:12px 0 0;border-top:1px solid var(--line);border-radius:0"><div class="hint">Telegram: ' + esc(p.tgName) + (p.username ? ' (@' + esc(p.username) + ')' : '') + '</div>' +
        '<input type="text" aria-label="Name to show" placeholder="Name to show" value="' + esc(f.name) + '" data-input="approveName" data-arg="' + esc(p.id) + '">' +
        '<select aria-label="Role" data-change="approveKind" data-arg="' + esc(p.id) + '">' + [['member', 'Member'], ['adminpays', 'Admin who also pays'], ['admin', 'Admin who doesn\'t pay (teacher)']].map(function (o) { return '<option value="' + o[0] + '"' + (f.kind === o[0] ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('') + '</select>' +
        '<div class="inline"><button class="primary" data-act="approve" data-arg="' + esc(p.id) + '">Approve</button><button class="plain" style="width:auto;padding:0 18px" data-act="decline" data-arg="' + esc(p.id) + '">Decline</button></div></div>';
    }).join('') + '</section>';
    h += '<section class="card"><h2>Team</h2>' + a.people.map(function (p) {
      var label = p.role === 'admin' ? (p.pays ? ' (admin)' : ' (teacher)') : '';
      return '<div class="row" style="justify-content:space-between"><span>' + esc(p.name + label) + '</span><button class="text-danger" data-act="removePerson" data-arg="' + esc(p.id) + '">Remove</button></div>';
    }).join('') + '<div class="hint">New people appear above after they open the app once.</div></section>';
    h += '<section class="card"><h2>Group chat</h2>';
    if (a.group.id) h += '<div>Connected to <strong>' + esc(a.group.title || 'your group') + '</strong>.</div>';
    else h += '<div class="hint">Add @pocaheels_bot to your group, then tap Find my group.</div>';
    h += '<button class="plain" data-act="findGroups">Find my group</button>';
    if (ui.groups) h += ui.groups.length ? ui.groups.map(function (g) {
      return '<div class="row" style="justify-content:space-between"><span>' + esc(g.title) + '</span><button class="small" data-act="setGroup" data-arg="' + esc(g.id) + '">Connect</button></div>';
    }).join('') : '<div class="hint">No group found yet. Remove the bot from the group, add it again, then tap Find my group.</div>';
    h += '</section>';
    var pn = ui.paynow === null ? S.paynow : ui.paynow;
    h += '<section class="card"><label for="paynow"><strong>PayNow number</strong></label><div class="inline"><input id="paynow" type="text" placeholder="Shown to members" value="' + esc(pn) + '" data-input="paynow"><button class="outline" data-act="savePaynow">Save</button></div></section>';
    return h;
  }

  // ---------- member ----------
  function myClassesCards() {
    var groups = {}, order = [];
    S.myClasses.forEach(function (c) {
      var m = c.date.slice(0, 7);
      if (!groups[m]) { groups[m] = []; order.push(m); }
      groups[m].push(c);
    });
    if (!order.length) return '<section class="card"><div class="hint">No upcoming classes yet.</div></section>';
    return order.slice(0, 3).map(function (m) {
      return '<h2 class="month">' + monthOf(m) + (m < S.startMonth ? ' <small>already paid</small>' : '') + '</h2>' + groups[m].map(function (c) {
        var hint = '';
        if (c.status === 'absent') hint = c.paid && c.special ? 'Special class: already paid, so this cannot be offset.' : c.paid ? '$' + S.training + ' comes off your next payment.' : 'You only pay the $' + S.rent + ' rent for this class.';
        else if (c.special) hint = 'External teacher. Cannot be offset once paid.';
        return '<section class="card"><div class="titlerow"><strong>' + lab(c.date) + '</strong>' + (c.special ? '<span class="tag special">Special</span>' : '') + '</div><div class="when">' + esc(whenWhere(c)) + '</div><div class="seg">' +
          [['coming', 'Coming'], ['late', 'Late'], ['absent', 'Absent']].map(function (o) { return '<button class="' + o[0] + (c.status === o[0] ? ' on' : '') + '" data-act="status" data-arg="' + c.date + '|' + o[0] + '">' + o[1] + '</button>'; }).join('') + '</div>' +
          (c.status === 'late' ? '<input type="text" aria-label="Arrival time or note" placeholder="e.g. ETA 8.30pm" value="' + esc(c.note) + '" data-note="' + c.date + '">' : '') +
          (hint ? '<div class="hint">' + esc(hint) + '</div>' : '') + '</section>';
      }).join('');
    }).join('');
  }
  function myClassesView() {
    return '<h1>My classes</h1><div class="hint pad">You\'re marked as coming unless you change it.</div>' + myClassesCards();
  }
  function myPaymentView() {
    var r = S.myPayment;
    var amt = r.state === 'claimed' || r.state === 'paid' ? r.paid : r.toPay;
    var status = r.state === 'paid' ? 'Paid and confirmed' : r.state === 'claimed' ? 'Waiting for your teacher to confirm' : r.state === 'nothing' ? 'Nothing to pay this month' : 'Not paid yet';
    var h = '<h1>My payment</h1><section class="card"><div class="hint">' + monthOf(S.month) + ', due ' + lab(S.due).slice(4) + '</div><div class="amount">$' + amt + '</div><strong>' + status + '</strong>' + linesHtml(r.lines);
    if (r.state !== 'none' && r.after) h += '<div class="note">' + esc(carryText(r.after, S.month)) + '</div>';
    h += '</section>';
    if (r.state === 'none') h += '<section class="card"><div>' + (S.paynow ? 'PayNow to <strong>' + esc(S.paynow) + '</strong>, with your name in the reference.' : 'Pay your teacher, with your name in the reference.') + '</div><button class="primary" data-act="claim">I\'ve paid</button></section>';
    if (r.state === 'claimed') h += '<button class="plain" data-act="unclaim">I tapped this by mistake</button>';
    return h;
  }

  // ---------- page ----------
  function center(title, text, retry) {
    return '<div class="center"><h1>' + esc(title) + '</h1><div class="hint">' + esc(text) + '</div>' + (retry ? '<button class="primary" style="max-width:240px" data-act="reload">Try again</button>' : '') + '</div>';
  }
  function render() {
    var y = window.scrollY, html;
    if (ui.loadError) html = center('Something went wrong', ui.loadError, true);
    else if (!S) html = center('Loading', 'One moment...');
    else if (S.pending) html = center('Almost there', 'Hi ' + S.name + '. Your teacher needs to approve you before you can use the app. Check back soon.', true);
    else if (S.removed) html = center('No access', 'You\'re no longer on this team. Ask your teacher if this is a mistake.');
    else {
      var tabs = [];
      if (S.admin) tabs = [['classes', 'Classes'], ['payments', 'Payments'], ['people', 'People']];
      tabs.push(['myclasses', S.admin ? 'My classes' : 'My classes']);
      if (S.myPayment) tabs.push(['mypay', 'My payment']);
      if (S.admin && !S.me.pays) tabs = tabs.filter(function (n) { return n[0] !== 'myclasses'; });
      var view = ui.tab === 'classes' ? classesView() : ui.tab === 'payments' ? paymentsView() : ui.tab === 'people' ? peopleView() : ui.tab === 'mypay' ? myPaymentView() : myClassesView();
      html = '<main>' + view + '</main><nav>' + tabs.map(function (n) { return '<button class="' + (ui.tab === n[0] ? 'on' : '') + '" data-act="tab" data-arg="' + n[0] + '">' + n[1] + '</button>'; }).join('') + '</nav>' + sheetView();
    }
    if (ui.toast) html += '<div class="toast" role="status"><span>' + esc(ui.toast) + '</span>' + (ui.undo ? '<button data-act="undo">Undo</button>' : '') + '</div>';
    if (ui.saving && S) html += '<div class="saving" role="status">Saving...</div>';
    document.getElementById('app').innerHTML = html;
    window.scrollTo(0, y);
  }

  var actions = {
    reload: function () { ui.loadError = null; call('state'); },
    tab: function (a) { ui.tab = a; window.scrollTo(0, 0); render(); },
    pick: function (a) { ui.sel = a; ui.edit = false; ui.draft = null; render(); },
    jump: function (a) { var d = dt(a); ui.sel = a; ui.draft = null; ui.y = d.getFullYear(); ui.m = d.getMonth(); render(); },
    calMonth: function (a) { var d = new Date(ui.y, ui.m + Number(a), 1); ui.y = d.getFullYear(); ui.m = d.getMonth(); ui.sel = null; render(); },
    payMonth: function (a) { var m = addMonth(S.month, Number(a)); if (m < S.startMonth) return; ui.month = m; call('state'); },
    addClass: function () {
      var f = ui.draft;
      call('saveClass', { date: f.date, start: f.start, end: f.end, location: f.location, special: f.special, cancelled: false, notify: f.notify }, function () { ui.draft = null; toast('Class added.'); });
    },
    saveClass: function () {
      var f = ui.draft;
      var statuses = Object.keys(f.statuses).map(function (id) { return { id: id, status: f.statuses[id] }; });
      call('saveClass', { date: f.date, start: f.start, end: f.end, location: f.location, special: f.special, statuses: statuses, notify: f.notify }, function () { ui.draft = null; toast('Saved.'); });
    },
    restoreClass: function () { ui.draft = null; call('saveClass', { date: ui.sel, cancelled: false }); },
    cancelClass: function () {
      var day = ui.sel;
      ui.draft = null;
      call('saveClass', { date: day, cancelled: true, notify: true }, function () { toast('Class cancelled.', { action: 'saveClass', payload: { date: day, cancelled: false } }); });
    },
    toggleEdit: function () { ui.edit = !ui.edit; render(); },
    postHeadcount: function () { call('postHeadcount', { date: ui.sel }, function () { toast('Posted to the group.'); }); },
    open: function (a) { ui.sheet = a; ui.diff = ''; ui.toast = null; render(); },
    closeSheet: function () { ui.sheet = null; render(); },
    confirm: function (a) { call('confirm', { id: a }, function () { toast('Confirmed.'); }); },
    remind: function () {
      var ids = S.admin.payments.filter(function (r) { return r.state === 'none' && !ui.unsel[r.id]; }).map(function (r) { return r.id; });
      if (!ids.length) { toast('Tick at least one person first.'); render(); return; }
      call('remind', { ids: ids }, function () { toast('Reminder posted to the group.'); });
    },
    markAll: function () {
      var ids = S.admin.payments.filter(function (r) { return r.state === 'none' || r.state === 'claimed'; }).map(function (r) { return r.id; });
      var month = S.month;
      call('markAll', {}, function () { toast('Everyone marked as paid.', { action: 'resetPay', payload: { ids: ids, month: month } }); });
    },
    markExact: function () { var id = ui.sheet; ui.sheet = null; call('markPaid', { id: id }, function () { toast('Marked as paid.'); }); },
    saveDiff: function () {
      var n = Number(ui.diff), id = ui.sheet;
      if (ui.diff === '' || isNaN(n) || n < 0) return;
      ui.sheet = null;
      call('markPaid', { id: id, amount: n }, function () { toast('$' + n + ' saved.'); });
    },
    resetPay: function () { var id = ui.sheet; ui.sheet = null; call('resetPay', { id: id }); },
    download: function () { var u = S.admin.sheetUrl; if (tg && tg.openLink) tg.openLink(u); else window.open(u); },
    approve: function (a) {
      var f = ui.approve[a];
      call('approve', { id: a, name: f.name, role: f.kind === 'member' ? 'member' : 'admin', pays: f.kind !== 'admin' }, function () { delete ui.approve[a]; toast(f.name + ' approved.'); });
    },
    decline: function (a) { call('decline', { id: a }); },
    removePerson: function (a) {
      var p = S.admin.people.filter(function (x) { return x.id === a; })[0];
      call('removePerson', { id: a }, function () { toast(p.name + ' removed.', { action: 'restorePerson', payload: { id: a, role: p.role } }); });
    },
    findGroups: function () { call('findGroups'); },
    setGroup: function (a) {
      var g = ui.groups.filter(function (x) { return x.id === a; })[0];
      call('setGroup', { id: a, title: g.title }, function () { ui.groups = null; toast('Group connected.'); });
    },
    savePaynow: function () { var v = ui.paynow === null ? S.paynow : ui.paynow; call('setPaynow', { value: v }, function () { ui.paynow = null; toast('Saved.'); }); },
    status: function (a) {
      var p = a.split('|');
      var cur = S.myClasses.filter(function (c) { return c.date === p[0]; })[0];
      call('setStatus', { date: p[0], status: p[1], note: cur ? cur.note : '' });
    },
    claim: function () { call('claim', {}, function () { toast('Sent to your teacher to confirm.'); }); },
    unclaim: function () { call('unclaim'); },
    undo: function () { var u = ui.undo; ui.toast = null; ui.undo = null; if (u) call(u.action, u.payload); }
  };

  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]');
    if (!el || ui.saving && el.getAttribute('data-act') !== 'closeSheet' && el.getAttribute('data-act') !== 'tab') return;
    actions[el.getAttribute('data-act')](el.getAttribute('data-arg'));
  });
  document.addEventListener('change', function (e) {
    var k = e.target.getAttribute('data-change');
    var dc = e.target.getAttribute('data-draftcheck');
    if (dc && ui.draft) ui.draft[dc] = e.target.checked;
    if (k === 'unsel') { ui.unsel[e.target.getAttribute('data-arg')] = !e.target.checked; render(); }
    if (k === 'statusFor' && ui.draft) ui.draft.statuses[e.target.getAttribute('data-arg')] = e.target.value;
    if (k === 'approveKind') ui.approve[e.target.getAttribute('data-arg')].kind = e.target.value;
    var note = e.target.getAttribute('data-note');
    if (note) call('setStatus', { date: note, status: 'late', note: e.target.value });
  });
  document.addEventListener('input', function (e) {
    var k = e.target.getAttribute('data-input');
    var dk = e.target.getAttribute('data-draft');
    if (dk && ui.draft) ui.draft[dk] = e.target.value;
    if (k === 'diff') { ui.diff = e.target.value; document.getElementById('diffnote').textContent = diffNote().replace(/&amp;/g, '&'); }
    if (k === 'paynow') ui.paynow = e.target.value;
    if (k === 'approveName') ui.approve[e.target.getAttribute('data-arg')].name = e.target.value;
  });
  document.addEventListener('visibilitychange', function () { if (!document.hidden && S && !ui.saving && !ui.sheet && !ui.draft) call('state'); });

  render();
  call('state');
})();
</script>
</body>
</html>
